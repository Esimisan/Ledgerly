<!doctype html>
<html lang="en">
  <head>
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png?v=20261113"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261113" />
    <link rel="shortcut icon" href="/favicon.ico?v=20261113" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=20261113"
    />
    <meta name="apple-mobile-web-app-title" content="Ledgerly" />
    <link rel="manifest" href="/site.webmanifest?v=20261113" />
    <meta
      name="description"
      content="Ledgerly brings sales, inventory, expenses, customers, suppliers and reports together in one place."
    />

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Ledgerly – Business management for small businesses</title>

    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      (function () {
        var theme = "light";
        try {
          var forced = new URLSearchParams(location.search).get("theme");
          var pref =
            forced === "light" || forced === "dark"
              ? forced
              : localStorage.getItem("ledgerly-theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          theme = dark ? "dark" : "light";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
